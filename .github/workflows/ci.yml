name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # No TYPESAFE_API_KEY in this step, so TestLive* skip and no tokens are spent.
      - name: Test
        run: go test -race -count=1 ./...

      # Runs only when the repository secret is set. Pull requests from forks
      # do not receive secrets, so there the step prints a note and passes.
      - name: Live API
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "TYPESAFE_API_KEY is not set; skipping live tests"
            exit 0
          fi
          go test -race -count=1 -run '^TestLive' -v .
